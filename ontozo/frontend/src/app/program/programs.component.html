<div class="page-container">
    <h2>Programok</h2>

    <div *ngIf="!programs" class="load-spinner">
        <mat-spinner diameter="30"></mat-spinner>
    </div>

    <div *ngIf="programs" class="button-holder">
        <button mat-raised-button color="primary" (click)="nextZone(); $event.stopPropagation()">
            <!--Következő zóna-->
            <mat-icon class="material-icons-outlined icon-big">skip_next</mat-icon>
        </button>
        <button mat-raised-button color="primary" (click)="stopProgram(); $event.stopPropagation()">
            <!--Stop-->
            <mat-icon class="material-icons-outlined icon-big">stop</mat-icon>
        </button>
    </div>
    <div *ngIf="programs">

        <table mat-table [dataSource]="dataSource" multiTemplateDataRows class="mat-elevation-z8">

            <!--- Note that these columns can be defined in any order.
                  The actual rendered columns are set as a property on the row definition" -->

            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef> Név</th>
                <td mat-cell *matCellDef="let element"> {{ element.name }}</td>
            </ng-container>

            <ng-container matColumnDef="enabled">
                <th mat-header-cell *matHeaderCellDef> Engedélyezve</th>
                <td mat-cell *matCellDef="let element">
                    <mat-icon
                            *ngIf="element.enabled && element.days && element.days.type != ProgramDayType.unused"
                            class="material-icons-outlined on">timer
                    </mat-icon>
                    <mat-icon *ngIf="!element.enabled" class="material-icons-outlined off">timer_off</mat-icon>
                </td>
            </ng-container>

            <!-- mobile: details -->
            <ng-container matColumnDef="start">
                <th mat-header-cell *matHeaderCellDef> Indítás</th>
                <td mat-cell *matCellDef="let element">
                    <div class="program-start-times"> {{ element.startTimes }}</div>
                    <div class="program-days">
                        <div *ngIf="element.days.type=='on'">
                            <div *ngFor="let day of programDaysDisplay; let i = index"
                                 class="program-day {{this.hasDay(element, i)?'on':'off'}}">
                                {{ day }}
                            </div>
                        </div>

                        <div *ngIf="element.days.type=='interval'">
                            {{ element.days.intervalDays }} naponta
                        </div>
                    </div>
                </td>
            </ng-container>

            <ng-container matColumnDef="expand">
                <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
                <td mat-cell *matCellDef="let element">
                    <button mat-icon-button aria-label="expand row"
                            (click)="clickExpand(element); $event.stopPropagation()">
                        <mat-icon *ngIf="expandedElement !== element">keyboard_arrow_down</mat-icon>
                        <mat-icon *ngIf="expandedElement === element">keyboard_arrow_up</mat-icon>
                    </button>
                </td>
            </ng-container>

            <ng-container matColumnDef="expandedDetail">
                <td mat-cell *matCellDef="let element" [attr.colspan]="displayedColumns.length">
                    <div class="program-detail"
                         [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
                        <div class="button-holder">
                            <button mat-raised-button color="primary"
                                    (click)="startProgram(element); $event.stopPropagation()">
                                <mat-icon class="material-icons-outlined">start</mat-icon>
                            </button>
                            <button mat-raised-button color="secondary">
                                <mat-icon class="material-icons-outlined ">edit</mat-icon>
                            </button>
                            <button mat-raised-button color="secondary">
                                <mat-icon class="material-icons-outlined ">delete</mat-icon>
                            </button>
                        </div>
                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let element; columns: displayedColumns;"
                class="program-row"
                [class.program-expanded-row]="expandedElement === element"
                (click)="clickExpand(element)">
            </tr>

            <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="program-detail-row"></tr>
        </table>
        <div class="button-row">
            <button mat-fab color="primary">
                <mat-icon class="material-icons-outlined ">add</mat-icon>
            </button>
        </div>
    </div>
</div>
