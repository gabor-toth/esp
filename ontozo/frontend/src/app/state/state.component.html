<div class="state-container">
    <div class="time">
        {{remoteTime!}}
    </div>
    <h2>Pumpák</h2>
    <div *ngIf="state && state.outputs" class="card-container">
        <div *ngFor="let pump of state.outputs.pumps" class="card" (click)="click('pumps',pump.id,!pump.on)">
            <mat-icon *ngIf="pump.on" class="material-icons-outlined on icon-switch">toggle_on</mat-icon>
            <mat-icon *ngIf="!pump.on" class="material-icons-outlined off icon-switch">toggle_off</mat-icon>
            <span>{{pump.name}}</span>
        </div>
    </div>

    <h2>Zónák</h2>
    <div *ngIf="state && state.outputs" class="card-container">
        <div *ngFor="let zone of state.outputs.zones" class="card" (click)="click('zones',zone.id,!zone.on)">
            <mat-icon *ngIf="zone.on" class="material-icons-outlined on icon-switch">toggle_on</mat-icon>
            <mat-icon *ngIf="!zone.on" class="material-icons-outlined off icon-switch">toggle_off</mat-icon>
            <span>{{zone.name}}</span>
        </div>
    </div>

    <h2>Szintek</h2>
    <div *ngIf="state && state.inputs" class="card-container">
        <div *ngFor="let level of state.inputs.levels" class="card-level {{level.on?'filled':''}}">
        </div>
    </div>

    <h2>Gombok</h2>
    <div *ngIf="state && state.inputs" class="card-container">
        <div *ngFor="let button of state.inputs.buttons" class="card" (click)="click('buttons',button.id,!button.on)">
            <mat-icon *ngIf="button.on" class="material-icons-outlined on icon-switch">toggle_on</mat-icon>
            <mat-icon *ngIf="!button.on" class="material-icons-outlined off icon-switch">toggle_off</mat-icon>
            <span>{{button.name}}</span>
        </div>
    </div>
</div>
